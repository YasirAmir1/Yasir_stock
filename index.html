<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection errors (HMR is disabled in this environment)
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var text = Array.prototype.slice.call(arguments).map(function(item) {
            return String(item && item.stack ? item.stack : (item && item.message ? item.message : item));
          }).join(' ');
          if (text.includes('WebSocket') || text.includes('@vite/client') || text.includes('[vite]')) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = String(e.message || '');
          var file = String(e.filename || '');
          var stack = String(e.error && e.error.stack ? e.error.stack : '');
          if (msg.includes('WebSocket') || file.includes('@vite/client') || stack.includes('WebSocket') || msg.includes('vite')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = String(reason && reason.message ? reason.message : reason || '');
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('vite')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مبيعات تكريت" />
    <title>تطبيق ياسر للمبيعات | مبيعات كالة تكريت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-emerald-950 text-slate-900 font-['Cairo',sans-serif] antialiased min-h-screen selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
